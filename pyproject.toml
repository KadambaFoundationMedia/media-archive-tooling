[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-archive-tooling"
version = "0.1.0"
description = "Tools for processing media files in the archive"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "rapidfuzz>=3.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
media-archive = "media_archive_tooling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_archive_tooling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
